name: Verify protected handbook
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/auth.test.mjs tests/server.test.mjs
      - run: node --experimental-strip-types --test tests/learning.test.ts
      - run: npm run build:secure
# Never publish dist to Pages: all handbook assets require server authentication.
